name: Release

# On every push to main, two jobs run:
#
#  - check: unit tests (`npm test`) plus a check that the committed bpmn-js
#    bundle in web/vendor/ matches the bpmn-js version in the lockfile. It runs
#    on macOS: v1 supports macOS only, and the server cannot start on Linux yet
#    (its wildcard-listener probe in src/server.js always hits EADDRINUSE there,
#    so every server test fails with "No free port found").
#  - publish: gated on check; publishes bpmn-edit when the version in
#    package.json is not yet on npm. Pushes without a version bump make this
#    job a fast no-op (the registry probe needs nothing installed).
#
# E2E tests (test/e2e, Playwright) do NOT run here; they stay a local gate:
#  - the server does not start on Linux (see above), which rules out
#    ubuntu-latest for now;
#  - the tunnel specs (s7-share-tunnel, s8-keepalive-tunnel) open real
#    Cloudflare quick tunnels, which are rate-limited (HTTP 429) per network;
#  - several specs are load-sensitive (see the S10 backlog in PLAN.md), and an
#    unmeasured, flaky e2e job would only teach people to ignore red runs.
# A macOS e2e job (`npx playwright install chrome`, `--project=chrome`,
# BPMN_EDIT_SKIP_TUNNEL_E2E=1, non-blocking) is the follow-up once it has been
# measured on a real runner. See docs/release-procedure.md.
#
# Publishing uses npm Trusted Publishing (OIDC): the package on npmjs.com lists
# this repo + workflow file as its trusted publisher, and
# permissions.id-token=write lets GitHub mint the OIDC token that npm (>= 11.5.1)
# exchanges for short-lived publish credentials. There is no NPM_TOKEN secret
# and no NODE_AUTH_TOKEN. Provenance attestation (the signed link from the
# tarball to this exact workflow run + commit) is generated automatically on
# OIDC publishes; NPM_CONFIG_PROVENANCE=true just keeps it explicit.
#
# Renaming this file breaks publishing until the trusted-publisher config on
# npmjs.com is recreated with the new name.

on:
  push:
    branches: [main]
  # The Version workflow pushes its bump commit with the default GITHUB_TOKEN,
  # which by design does not trigger other workflows, so it dispatches this one
  # explicitly afterwards. publish probes npm before acting, so a manual run
  # with nothing new to ship is a no-op.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check
    runs-on: macos-latest
    # The unit tests take ~25 s locally. When the server cannot bind (measured
    # in a Linux container), share/ws tests hang instead of failing, so cap the
    # job rather than burn the 6 h default.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # web/vendor/bpmn-js/ is committed so the package needs no build step.
      # Re-vendoring from node_modules must change nothing; otherwise a bpmn-js
      # bump in the lockfile was not followed by `npm run vendor`.
      - name: Check that the vendored bpmn-js is up to date
        run: |
          set -euo pipefail
          npm run vendor
          # --porcelain lists modified, deleted and untracked files alike.
          changes=$(git status --porcelain -- web/vendor)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::web/vendor/bpmn-js is out of date; run \`npm run vendor\` and commit the result"
            exit 1
          fi

  publish:
    name: Publish to npm
    # Trusted Publishing only accepts GitHub-hosted runners.
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # No `registry-url` on purpose: with it, setup-node writes an .npmrc that
      # reads NODE_AUTH_TOKEN, and that token placeholder can stop npm from
      # falling back to OIDC.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # OIDC publishing needs npm >= 11.5.1. Node 24 bundles npm 11.x (Node
      # 24.21.0 ships 11.19.0), so this only guards against a regression. We
      # fail instead of running `npm install -g npm@...`: the publish should use
      # the npm that the pinned Node release ships, not whatever the registry
      # serves that day, and an old npm here fails with a misleading
      # ENEEDAUTH / 404 that this turns into a clear message.
      - name: Check the npm version
        run: |
          set -euo pipefail
          npm_version=$(npm --version)
          echo "::notice::node $(node --version), npm $npm_version"
          if ! node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1);
          ' "$npm_version"; then
            echo "::error::npm $npm_version is too old for Trusted Publishing (needs >= 11.5.1)"
            exit 1
          fi

      # Decides before doing anything else, so a push without a version bump
      # costs one registry request.
      - name: Check whether this version is already on npm
        id: probe
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "$name@$version" version 2>/dev/null || true)" ]; then
            echo "::notice::$name@$version already on npm, skipping"
            echo "needs_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$name@$version is new, will publish"
            echo "needs_publish=true" >> "$GITHUB_OUTPUT"
          fi

      # No `npm ci`: the package has no build step and no prepack/prepublish
      # scripts (web/vendor is committed), so publishing reads only the files in
      # the checkout. The dry-run puts the exact tarball contents in the log.
      - name: List the package contents
        if: steps.probe.outputs.needs_publish == 'true'
        run: npm pack --dry-run

      - name: Publish
        if: steps.probe.outputs.needs_publish == 'true'
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: npm publish --access public

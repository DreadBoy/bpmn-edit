<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>local-bpmn</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="vendor/bpmn-js/assets/diagram-js.css">
  <link rel="stylesheet" href="vendor/bpmn-js/assets/bpmn-js.css">
  <link rel="stylesheet" href="vendor/bpmn-js/assets/bpmn-font/css/bpmn.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="presence.css">
</head>
<body>
  <header id="toolbar">
    <span class="brand">local-bpmn</span>
    <span id="file-name" title=""></span>
    <span id="notice" role="status" aria-live="polite" hidden></span>
    <span id="save-status" role="status" aria-live="polite" data-state="connecting">Connecting…</span>
    <div id="share" hidden>
      <button id="share-start" type="button" title="Start a public link collaborators can open">Share</button>
      <span id="share-progress" role="status" aria-live="polite" hidden>
        <span class="spinner" aria-hidden="true"></span><span id="share-progress-text">Starting tunnel…</span>
      </span>
      <span id="share-active" hidden>
        <input id="share-url" type="text" readonly aria-label="Public link" title="Anyone with this link can view and edit the diagram">
        <button id="share-copy" type="button">Copy</button>
        <button id="share-stop" type="button">Stop sharing</button>
      </span>
    </div>
  </header>
  <div id="share-error" role="alert" hidden>
    <span id="share-error-text"></span>
    <button id="share-error-close" type="button" aria-label="Dismiss">×</button>
  </div>
  <main id="canvas"></main>
  <div id="error" role="alert" hidden></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <div id="reconnecting" role="status" aria-live="polite" hidden>
    <span class="spinner" aria-hidden="true"></span>Connection lost. Reconnecting…
  </div>
  <div id="session-overlay" role="alertdialog" aria-modal="true" aria-labelledby="session-overlay-title"
       aria-describedby="session-overlay-text" hidden>
    <div class="session-card">
      <h2 id="session-overlay-title">Session ended</h2>
      <p id="session-overlay-text"></p>
      <button id="session-overlay-action" type="button" hidden>Reconnect</button>
    </div>
  </div>

  <script src="vendor/bpmn-js/bpmn-modeler.production.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
